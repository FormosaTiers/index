<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formosa Tiers - 台灣頂尖玩家排行榜</title>
    <link rel="icon" href="./images/icon.png" type="image/png">
    <script src="https://unpkg.com/skinview3d@3.0.0/bundles/skinview3d.bundle.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #05070a;
            --bg-panel: rgba(18, 20, 28, 0.7);
            --bg-card: #1c1f26;
            --text-white: #f8f9fa;
            --text-grey: #94a3b8;
            
            /* Tier Colors */
            --tier1-color: #fbbf24;
            --tier2-color: #cbd5e1;
            --tier3-color: #fb923c;
            --tier4-color: #60a5fa;
            --tier5-color: #4ade80;
            
            --accent-blue: #3b82f6;
            --modal-overlay: rgba(0, 0, 0, 0.9);
            --vanilla-purple: #d8b4fe; /* 水晶專屬色 */
        }

        /* 滾動動畫 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInLeft {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes fadeInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .scroll-animate {
            opacity: 0;
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }

        .scroll-animate.fade-up {
            transform: translateY(30px);
        }

        .scroll-animate.fade-left {
            transform: translateX(-30px);
        }

        .scroll-animate.fade-right {
            transform: translateX(30px);
        }

        .scroll-animate.scale {
            transform: scale(0.9);
        }

        .scroll-animate.visible {
            opacity: 1;
            transform: translate(0) scale(1);
        }

        /* 全域樣式優化 */
        * { box-sizing: border-box; transition: background 0.3s, border 0.3s, transform 0.2s; }
        
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2d3139; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--accent-blue); }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: 'Inter', 'Noto Sans TC', sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center; 
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(59, 130, 246, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(251, 191, 36, 0.05) 0%, transparent 40%);
        }

        /* --- 頂部 Header --- */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            padding: 15px 25px;
            background: var(--bg-panel);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            width: 100%;
            max-width: 1260px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link {
            color: var(--text-grey);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-white);
        }

        .nav-link-discord {
            background: linear-gradient(135deg, #5865F2 0%, #4752C4 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(88, 101, 242, 0.3);
        }

        .nav-link-discord:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(88, 101, 242, 0.5);
            background: linear-gradient(135deg, #677F7F 0%, #5a62c9 100%);
        }

        /* Filter and Search Row */
        .filter-search-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1260px;
            margin-bottom: 25px;
            gap: 15px;
            flex-wrap: wrap;
        }

        .top-search-container {
            position: relative;
            width: 100%;
            max-width: 300px;
            z-index: 10;
            flex-shrink: 0;
            background: rgba(0,0,0,0.4);
            border-radius: 14px;
        }

        .top-search-container input {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            padding: 10px 18px;
            width: 100%;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.3s, background 0.3s;
        }

        .top-search-container input:focus {
            border-color: var(--accent-blue);
            background: rgba(0,0,0,0.6);
        }

        .search-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            max-height: 250px;
            overflow-y: auto;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            z-index: 100;
            margin-top: 5px;
            display: none; /* 預設隱藏 */
        }

        .search-results.show { display: block; }

        .search-result-item {
            padding: 10px 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--text-white);
        }

        .search-result-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .search-result-item:first-child { border-top-left-radius: 12px; border-top-right-radius: 12px; }
        .search-result-item:last-child { border-bottom-left-radius: 12px; border-bottom-right-radius: 12px; }

        .search-result-avatar {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.2);
            flex-shrink: 0;
        }

        .search-result-name {
            font-size: 0.9rem;
            font-weight: 600;
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-result-tier {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-grey);
            text-transform: uppercase;
            flex-shrink: 0;
        }

        /* --- 導航列 --- */
        .navbar {
            display: flex;
            gap: 6px;
            margin-bottom: 30px;
            overflow-x: auto;
            padding: 5px;
            width: 100%;
            max-width: 1260px;
            scrollbar-width: none;
            position: relative;
        }
        .navbar::-webkit-scrollbar { display: none; }

        .nav-menu {
            display: flex;
            gap: 6px;
            flex-wrap: nowrap;
        }

        .hamburger {
            display: none;
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 8px;
            color: var(--text-grey);
            font-size: 1.2rem;
            padding: 8px 12px;
            cursor: pointer;
        }

        .hamburger:hover {
            background: rgba(255,255,255,0.08);
            color: #fff;
        }

        .nav-item {
            padding: 8px 16px;
            color: var(--text-grey);
            cursor: pointer;
            font-weight: 700;
            font-size: 0.9rem;
            background: var(--bg-panel);
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.05);
            backdrop-filter: blur(8px);
            white-space: nowrap;
        }
        
        .nav-item:hover { color: #fff; background: rgba(255,255,255,0.08); transform: translateY(-2px); }

        .nav-item.active {
            color: white;
            background: var(--accent-blue);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        /* --- Tier Filter --- */
        .tier-filter-container {
            display: flex;
            gap: 8px;
            width: auto;
            flex: 1;
            overflow-x: auto;
            padding: 5px;
            scrollbar-width: none;
        }
        .tier-filter-container::-webkit-scrollbar { display: none; }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 12px;
            background: var(--bg-panel);
            border: 1px solid rgba(255,255,255,0.05);
            color: var(--text-grey);
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s;
        }

        .filter-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .filter-btn.active {
            background: rgba(255,255,255,0.15);
            color: #fff;
            border-color: rgba(255,255,255,0.2);
        }

        .filter-btn.t1.active { background: var(--tier1-color); color: #000; box-shadow: 0 4px 12px rgba(251, 191, 36, 0.3); }
        .filter-btn.t2.active { background: var(--tier2-color); color: #000; box-shadow: 0 4px 12px rgba(203, 213, 225, 0.3); }
        .filter-btn.t3.active { background: var(--tier3-color); color: #000; box-shadow: 0 4px 12px rgba(251, 146, 60, 0.3); }
        .filter-btn.t4.active { background: var(--tier4-color); color: #fff; box-shadow: 0 4px 12px rgba(96, 165, 250, 0.3); }
        .filter-btn.t5.active { background: var(--tier5-color); color: #000; box-shadow: 0 4px 12px rgba(74, 222, 128, 0.3); }

        /* --- Tier Board --- */
        .tier-board {
            display: flex;
            flex-direction: column;
            gap: 0;
            width: 100%;
            max-width: 1260px;
            align-items: stretch;
            justify-content: flex-start;
            margin-bottom: auto; /* 這會確保它下方有剩餘空間，而不是上方 */
        }

        .tier-column {
            display: none;
        }

        .tier-header {
            display: none;
        }

        .player-list { 
            padding: 0; 
            min-height: auto;
            display: contents;
        }

        .player-list:last-of-type {
            border-bottom: none;
        }

        .player-card {
            background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, rgba(255,255,255,0.02) 100%);
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-radius: 12px;
            cursor: pointer;
            border: 2px solid transparent;
            border-left: 4px solid rgba(255,255,255,0.2);
            flex: none;
            width: 100%;
            margin-bottom: 8px;
            gap: 12px;
            transition: all 0.3s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .player-card.tier-1 {
            border-left-color: var(--tier1-color);
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.08) 0%, rgba(255,255,255,0.02) 100%);
        }

        .player-card.tier-2 {
            border-left-color: var(--tier2-color);
            background: linear-gradient(135deg, rgba(203, 213, 225, 0.08) 0%, rgba(255,255,255,0.02) 100%);
        }

        .player-card.tier-3 {
            border-left-color: var(--tier3-color);
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.08) 0%, rgba(255,255,255,0.02) 100%);
        }

        .player-card.tier-4 {
            border-left-color: var(--tier4-color);
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.08) 0%, rgba(255,255,255,0.02) 100%);
        }

        .player-card.tier-5 {
            border-left-color: var(--tier5-color);
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.08) 0%, rgba(255,255,255,0.02) 100%);
        }

        .player-card:hover { 
            transform: translateX(5px);
            border-color: rgba(255,255,255,0.15);
        }

        .player-card.tier-1:hover {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.15) 0%, rgba(255,255,255,0.03) 100%);
            box-shadow: 0 4px 20px rgba(251, 191, 36, 0.35);
            border-left-color: rgba(251, 191, 36, 1);
        }

        .player-card.tier-2:hover {
            background: linear-gradient(135deg, rgba(203, 213, 225, 0.15) 0%, rgba(255,255,255,0.03) 100%);
            box-shadow: 0 4px 20px rgba(203, 213, 225, 0.35);
            border-left-color: rgba(203, 213, 225, 1);
        }

        .player-card.tier-3:hover {
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.15) 0%, rgba(255,255,255,0.03) 100%);
            box-shadow: 0 4px 20px rgba(251, 146, 60, 0.35);
            border-left-color: rgba(251, 146, 60, 1);
        }

        .player-card.tier-4:hover {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.15) 0%, rgba(255,255,255,0.03) 100%);
            box-shadow: 0 4px 20px rgba(96, 165, 250, 0.35);
            border-left-color: rgba(96, 165, 250, 1);
        }

        .player-card.tier-5:hover {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.15) 0%, rgba(255,255,255,0.03) 100%);
            box-shadow: 0 4px 20px rgba(74, 222, 128, 0.35);
            border-left-color: rgba(74, 222, 128, 1);
        }

        .player-card .p-name {
            font-size: 0.95rem;
            font-weight: 600;
            flex: 1;
        }
        
        /* 玩家卡片滾動動畫 */
        .player-card.scroll-animate {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease-out, transform 0.5s ease-out, background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }
        
        .player-card.scroll-animate.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .player-avatar {
            width: 32px;
            height: 32px;
            aspect-ratio: 1/1;
            border-radius: 6px;
            flex: 0 0 32px;
            border: 2px solid rgba(255,255,255,0.2);
            transition: border-color 0.3s;
            object-fit: cover;
        }

        .tier-1 .player-avatar { border-color: var(--tier1-color); }
        .tier-2 .player-avatar { border-color: var(--tier2-color); }
        .tier-3 .player-avatar { border-color: var(--tier3-color); }
        .tier-4 .player-avatar { border-color: var(--tier4-color); }
        .tier-5 .player-avatar { border-color: var(--tier5-color); }

        .player-tier-badge {
            font-size: 1.5rem;
            font-weight: 900;
            padding: 0;
            border-radius: 0;
            background: none;
            border: none;
            box-shadow: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: white;
        }

        .player-card.tier-1 .player-tier-badge { color: var(--tier1-color); }
        .player-card.tier-2 .player-tier-badge { color: var(--tier2-color); }
        .player-card.tier-3 .player-tier-badge { color: var(--tier3-color); }
        .player-card.tier-4 .player-tier-badge { color: var(--tier4-color); }
        .player-card.tier-5 .player-tier-badge { color: var(--tier5-color); }

        /* --- 排行前3位的三列布局 --- */
        .top-3-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            width: 100%;
            margin-bottom: 20px;
            align-items: start;
        }

        .player-card.top-3 {
            flex-direction: column;
            width: 100%;
            padding: 0;
            border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.1);
            gap: 0;
            align-items: stretch;
            text-align: left;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            min-height: 360px;
        }

        /* 排名徽章样式 - 隐藏 */
        .rank-badge {
            display: none;
        }

        /* 对应tier的背景渐变 */
        .player-card.top-3.tier-1 {
            background: linear-gradient(135deg, rgba(251, 191, 36, 0.12) 0%, rgba(251, 191, 36, 0.04) 100%);
            border-left: 6px solid var(--tier1-color);
            box-shadow: 0 8px 32px rgba(251, 191, 36, 0.25), 0 0 20px rgba(251, 191, 36, 0.1);
        }

        .player-card.top-3.tier-2 {
            background: linear-gradient(135deg, rgba(203, 213, 225, 0.12) 0%, rgba(203, 213, 225, 0.04) 100%);
            border-left: 6px solid var(--tier2-color);
            box-shadow: 0 8px 32px rgba(203, 213, 225, 0.25), 0 0 20px rgba(203, 213, 225, 0.1);
        }

        .player-card.top-3.tier-3 {
            background: linear-gradient(135deg, rgba(251, 146, 60, 0.12) 0%, rgba(251, 146, 60, 0.04) 100%);
            border-left: 6px solid var(--tier3-color);
            box-shadow: 0 8px 32px rgba(251, 146, 60, 0.25), 0 0 20px rgba(251, 146, 60, 0.1);
        }

        .player-card.top-3.tier-4 {
            background: linear-gradient(135deg, rgba(96, 165, 250, 0.12) 0%, rgba(96, 165, 250, 0.04) 100%);
            border-left: 6px solid var(--tier4-color);
            box-shadow: 0 8px 32px rgba(96, 165, 250, 0.25), 0 0 20px rgba(96, 165, 250, 0.1);
        }

        .player-card.top-3.tier-5 {
            background: linear-gradient(135deg, rgba(74, 222, 128, 0.12) 0%, rgba(74, 222, 128, 0.04) 100%);
            border-left: 6px solid var(--tier5-color);
            box-shadow: 0 8px 32px rgba(74, 222, 128, 0.25), 0 0 20px rgba(74, 222, 128, 0.1);
        }

        .player-card.top-3:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: rgba(255,255,255,0.2);
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .player-card.top-3.tier-1:hover {
            box-shadow: 0 12px 40px rgba(251, 191, 36, 0.35), 0 0 30px rgba(251, 191, 36, 0.15);
        }

        .player-card.top-3.tier-2:hover {
            box-shadow: 0 12px 40px rgba(203, 213, 225, 0.35), 0 0 30px rgba(203, 213, 225, 0.15);
        }

        .player-card.top-3.tier-3:hover {
            box-shadow: 0 12px 40px rgba(251, 146, 60, 0.35), 0 0 30px rgba(251, 146, 60, 0.15);
        }

        .player-card.top-3.tier-4:hover {
            box-shadow: 0 12px 40px rgba(96, 165, 250, 0.35), 0 0 30px rgba(96, 165, 250, 0.15);
        }

        .player-card.top-3.tier-5:hover {
            box-shadow: 0 12px 40px rgba(74, 222, 128, 0.35), 0 0 30px rgba(74, 222, 128, 0.15);
        }

        .top-3-skin {
            width: 100%;
            height: 100%;
            background: transparent;
            border-radius: 0;
            object-fit: cover;
            object-position: center top;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 50%, rgba(0,0,0,0) 100%);
            transition: transform 0.3s;
            filter: drop-shadow(0 8px 16px rgba(0,0,0,0.3));
        }

        .player-card.top-3:hover .top-3-skin {
            transform: scale(1.02);
        }

        .top-3-info {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            gap: 0;
            position: relative;
            z-index: 2;
            padding: 16px;
            justify-content: space-between;
            flex: 1;
        }

        .top-3-name-rank {
            display: flex;
            flex-direction: row;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
            margin-bottom: auto;
        }

        .top-3-avatar {
            display: none;
        }

        .top-3-name {
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
            color: white;
        }

        .top-3-badge {
            font-size: 1.5rem;
            font-weight: 900;
            padding: 0;
            border-radius: 0;
            background: none;
            border: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: none;
            backdrop-filter: none;
            position: absolute;
            bottom: 16px;
            right: 16px;
            z-index: 3;
            color: white;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        .player-card.top-3.tier-1 .top-3-badge { color: var(--tier1-color); }
        .player-card.top-3.tier-2 .top-3-badge { color: var(--tier2-color); }
        .player-card.top-3.tier-3 .top-3-badge { color: var(--tier3-color); }
        .player-card.top-3.tier-4 .top-3-badge { color: var(--tier4-color); }
        .player-card.top-3.tier-5 .top-3-badge { color: var(--tier5-color); }

        /* --- 排行4-5位的两列布局 --- */
        .top-5-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            width: 100%;
            margin-bottom: 12px;
            align-items: start;
        }

        .player-card.rank-4-5 {
            flex-direction: row;
            padding: 0;
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            gap: 0;
            align-items: center;
            text-align: left;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
            min-height: 100px;
            aspect-ratio: 4 / 1;
        }

                    <span style="width: 12px; height: 2px; background: var(--accent-blue);"></span>

<script>
    let skinViewer = null;
    const googleSheetId = '1pRSRy8WOP5EJ7dng58QWZhuH90l4B0nFWqWI6rGoAyo';
    const baseApiUrl = 'https://formosa-tier-list-database-api.vercel.app/api';

    let database = {}; 
    let allPlayersFlat = []; // 用於搜尋的所有玩家數據
    let currentMode = 'sword';
    let currentTierFilter = 'all';

    const modeMapping = {
        'Sword': 'sword', 'UHC': 'uhc', 'Pot': 'DPot', 'NethOP': 'nethop',
        'SMP': 'SMP', 'Mace': 'Mace', 'Axe': 'axe', 'Vanilla': 'Vanilla'
    };

    const modeIcons = {
        'sword': '🗡️', 'uhc': '❤️', 'DPot': '🧪', 'nethop': '👾',
        'SMP': '🌍', 'Mace': '🔨', 'axe': '🪓', 'Vanilla': '💎'
    };

    const tierConfigs = [
        { name: "Tier 1", headerClass: "t1-header", icon: "🥇", color: "var(--tier1-color)" },
        { name: "Tier 2", headerClass: "t2-header", icon: "🥈", color: "var(--tier2-color)" },
        { name: "Tier 3", headerClass: "t3-header", icon: "🥉", color: "var(--tier3-color)" },
        { name: "Tier 4", headerClass: "t4-header", icon: "", color: "var(--tier4-color)" },
        { name: "Tier 5", headerClass: "t5-header", icon: "", color: "var(--tier5-color)" }
    ];

    const levelMap = {
        'H': { score: 3, label: 'H', color: '#f87171' },
        'M': { score: 2, label: 'M', color: '#fbbf24' },
        'L': { score: 1, label: 'L', color: '#4ade80' }
    };

    async function smartFetch(url) {
        try {
            const res = await fetch(url);
            if (res.ok) return await res.json();
        } catch (e) {
            console.error('Fetch error:', e);
        }
        return null;
    }

    window.onload = () => fetchAllData();

    async function fetchAllData() {
        const board = document.getElementById('tierBoard');
        board.innerHTML = `<div class="loading-data"><span class="loading-spinner"></span>正在連線至 Formosa 數據庫...</div>`;
        try {
            const rawData = await smartFetch(`${baseApiUrl}/tiers/overall`);
            processApiData(rawData);
            switchTab(document.querySelector('.nav-item.active'), 'Sword');
        } catch (err) {
            board.innerHTML = `<div class="loading-data">連線不穩定，請重新整理頁面。</div>`;
        }
    }

    function processApiData(data) {
        if (!Array.isArray(data)) return;
        database = {};
        allPlayersFlat = [];
        data.forEach(item => {
            const mode = item.mode;
            const tierName = `Tier ${item.tier}`;
            if (!database[mode]) database[mode] = {};
            if (!database[mode][tierName]) database[mode][tierName] = [];
            const playerObj = {
                name: item.player,
                level: (item.subtier || 'M').toUpperCase(),
                uuid: item.uuid,
                tier_rank: `${(item.subtier || 'M').toUpperCase()}T${item.tier}`,
                mode: mode // 添加 mode 屬性以區分玩家來自哪個模式
            };
            database[mode][tierName].push(playerObj);
            allPlayersFlat.push(playerObj);
        });
        Object.keys(database).forEach(m => sortMode(m));
        // 確保 allPlayersFlat 中的玩家不重複
        allPlayersFlat = Array.from(new Map(allPlayersFlat.map(p => [p.name, p])).values());
    }

    async function switchTab(el, displayName) {
        if(!el) return;
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        const mode = modeMapping[displayName];
        currentMode = mode;
        
        // 切換模式時重置 Tier 篩選器
        resetTierFilter();
        
        if (database[mode]) { renderBoard(mode); } else {
            renderLoading(displayName);
            await fetchSheetData(displayName);
            renderBoard(mode);
        }
    }

    function resetTierFilter() {
        currentTierFilter = 'all';
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.classList.remove('active');
            if (btn.innerText === '全部') btn.classList.add('active');
        });
    }

    function filterByTier(el, tier) {
        if (!el) return;
        document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
        el.classList.add('active');
        currentTierFilter = tier;
        renderBoard(currentMode);
    }

    async function fetchSheetData(sheetName) {
        try {
            const rows = await smartFetch(`https://opensheet.elk.sh/${googleSheetId}/${sheetName}`);
            const mode = modeMapping[sheetName];
            if (!database[mode]) database[mode] = {};
            rows.forEach(row => {
                if (!row.tier || !row.player) return;
                const tName = `Tier ${row.tier}`;
                if (!database[mode][tName]) database[mode][tName] = [];
                const playerObj = {
                    name: row.player, 
                    level: (row.level || 'M').toUpperCase(), 
                    uuid: row.uuid || '',
                    tier_rank: `${(row.level || 'M').toUpperCase()}T${row.tier}`, // 儲存 rank 字串
                    mode: mode // 添加 mode 屬性
                };
                database[mode][tName].push(playerObj);
                allPlayersFlat.push(playerObj);
            });
            sortMode(mode);
            // 確保 allPlayersFlat 中的玩家不重複
            allPlayersFlat = Array.from(new Map(allPlayersFlat.map(p => [p.name, p])).values());
        } catch (e) {}
    }

    function sortMode(m) {
        Object.keys(database[m]).forEach(t => {
            database[m][t].sort((a, b) => (levelMap[b.level]?.score || 0) - (levelMap[a.level]?.score || 0));
        });
    }

    function renderLoading(name) { 
        document.getElementById('tierBoard').innerHTML = `<div class="loading-data"><span class="loading-spinner"></span>正在載入 ${name} 列表...</div>`; 
    }

    function renderBoard(mode) {
        const board = document.getElementById('tierBoard');
        board.classList.remove('visible');
        board.innerHTML = '';
        const data = database[mode];
        if (!data) return;
        
        // 收集所有玩家並進行 Tier 過濾
        let allPlayers = [];
        tierConfigs.forEach((conf, idx) => {
            const tierNum = idx + 1;
            if (currentTierFilter === 'all' || currentTierFilter === tierNum) {
                const players = data[conf.name] || [];
                allPlayers.push(...players);
            }
        });
        
        if (allPlayers.length === 0) {
            board.innerHTML = '<div style="text-align:center; color: var(--text-grey); padding: 40px;">此條件下暫無玩家數據</div>';
            board.classList.add('visible');
            return;
        }

        board.classList.add('visible');
        
        // 建立一個主容器存放所有卡片
        const container = document.createElement('div');
        container.style.width = '100%';
        
        // 卡片動畫計數器
        let animCounter = 0;
        const CARD_ANIM_DELAY = 50; // 每張卡片之間的延遲（毫秒）
        
        // 如果是水晶模式，添加提示
        if (mode === 'Vanilla') {
            const notice = document.createElement('div');
            notice.style.cssText = 'background: rgba(216, 180, 254, 0.15); border: 1px solid rgba(216, 180, 254, 0.4); border-radius: 12px; padding: 15px 18px; margin-bottom: 20px; color: var(--vanilla-purple); font-size: 0.95rem; font-weight: 600; text-align: center; letter-spacing: 0.5px; box-shadow: 0 4px 12px rgba(216, 180, 254, 0.1);';
            notice.innerText = '💎 該 Tier List 由華人水晶圈提供，非 Formosa Tier List 之官方 Tier';
            board.appendChild(notice);
        }
        
        // 水晶模式直接显示所有玩家，不使用新布局
        if (mode === 'Vanilla') {
            allPlayers.forEach((p, idx) => {
                const card = createNormalPlayerCard(p);
                card.classList.add('scroll-animate', 'fade-up');
                card.style.transitionDelay = `${animCounter * CARD_ANIM_DELAY}ms`;
                container.appendChild(card);
                animCounter++;
            });
            board.appendChild(container);
            board.classList.add('visible');
            // 觸發卡片動畫
            setTimeout(() => triggerCardAnimations(container), 50);
            return;
        }
        
        // 非水晶模式：使用新布局
        // 只有在「全部」篩選下才使用 Top 3 / Top 5 特殊布局
        if (currentTierFilter === 'all') {
            // 前3位：三列布局
            if (allPlayers.length > 0) {
                const top3Container = document.createElement('div');
                top3Container.className = 'top-3-container';
                
                for (let i = 0; i < Math.min(3, allPlayers.length); i++) {
                    const card = createTop3PlayerCard(allPlayers[i], i + 1);
                    card.classList.add('scroll-animate', 'fade-up');
                    card.style.transitionDelay = `${animCounter * CARD_ANIM_DELAY}ms`;
                    top3Container.appendChild(card);
                    animCounter++;
                }
                
                container.appendChild(top3Container);
            }
            
            // 第4-5位：两列布局
            if (allPlayers.length > 3) {
                const top5Container = document.createElement('div');
                top5Container.className = 'top-5-container';
                
                for (let i = 3; i < Math.min(5, allPlayers.length); i++) {
                    const card = createRank45PlayerCard(allPlayers[i], i + 1);
                    card.classList.add('scroll-animate', 'fade-up');
                    card.style.transitionDelay = `${animCounter * CARD_ANIM_DELAY}ms`;
                    top5Container.appendChild(card);
                    animCounter++;
                }
                
                container.appendChild(top5Container);
            }
            
            // 第6位及以後：照常显示
            for (let i = 5; i < allPlayers.length; i++) {
                const card = createNormalPlayerCard(allPlayers[i]);
                card.classList.add('scroll-animate', 'fade-up');
                card.style.transitionDelay = `${animCounter * CARD_ANIM_DELAY}ms`;
                container.appendChild(card);
                animCounter++;
            }
        } else {
            // 如果選了特定 Tier，則全部使用普通卡片顯示
            allPlayers.forEach(p => {
                const card = createNormalPlayerCard(p);
                card.classList.add('scroll-animate', 'fade-up');
                card.style.transitionDelay = `${animCounter * CARD_ANIM_DELAY}ms`;
                container.appendChild(card);
                animCounter++;
            });
        }
        
        board.appendChild(container);
        board.classList.add('visible');
        // 觸發卡片動畫
        setTimeout(() => triggerCardAnimations(container), 50);
    }
    
    // 觸發容器內所有卡片的動畫
    function triggerCardAnimations(container) {
        const cards = container.querySelectorAll('.scroll-animate');
        cards.forEach(card => {
            card.classList.add('visible');
        });
    }

    function createNormalPlayerCard(p) {
        const card = document.createElement('div');
        card.className = 'player-card';
        card.onclick = () => showPlayerDetails(p);
        
        // 從 tier_rank 中提取 Tier 等級（格式: HT1, LT3 等）
        const tierMatch = p.tier_rank.match(/T(\d)/);
        const tierLevel = tierMatch ? parseInt(tierMatch[1]) : 5;
        card.classList.add(`tier-${tierLevel}`);
        
        const avatarHtml = p.uuid ? `<img src="https://mc-heads.net/avatar/${p.uuid}/32" class="player-avatar" alt="${p.name}">` : '<div class="player-avatar" style="background: rgba(255,255,255,0.1);"></div>';
        
        card.innerHTML = `
            <div style="display:flex; align-items:flex-start; gap:12px; flex:1;">
                ${avatarHtml}
                <span class="p-name">${p.name}</span>
            </div>
            <span class="player-tier-badge">${p.tier_rank}</span>
        `;
        return card;
    }

    function createTop3PlayerCard(p, rank) {
        const card = document.createElement('div');
        card.className = 'player-card top-3';
        card.onclick = () => showPlayerDetails(p);
        
        // 從 tier_rank 中提取 Tier 等級（格式: HT1, LT3 等）
        const tierMatch = p.tier_rank.match(/T(\d)/);
        const tierLevel = tierMatch ? parseInt(tierMatch[1]) : 5;
        card.classList.add(`tier-${tierLevel}`);
        
        const playerName = p.name.replace(/\s+/g, '_');
        
        card.innerHTML = `
            <img src="https://starlightskins.lunareclipse.studio/render/walking/${playerName}/full?bg=transparent" class="top-3-skin" alt="${p.name}" onerror="this.style.display='none'">
            <div class="top-3-info">
                <div class="top-3-name-rank">
                    <span class="top-3-name">${p.name}</span>
                </div>
                <span class="top-3-badge">${p.tier_rank}</span>
            </div>
        `;
        return card;
    }

    function createRank45PlayerCard(p, rank) {
        const card = document.createElement('div');
        card.className = 'player-card rank-4-5';
        card.onclick = () => showPlayerDetails(p);
        
        // 從 tier_rank 中提取 Tier 等級（格式: HT1, LT3 等）
        const tierMatch = p.tier_rank.match(/T(\d)/);
        const tierLevel = tierMatch ? parseInt(tierMatch[1]) : 5;
        card.classList.add(`tier-${tierLevel}`);
        
        const playerName = p.name.replace(/\s+/g, '_');
        
        card.innerHTML = `
            <div class="rank-4-5-name">${p.name}</div>
            <img src="https://starlightskins.lunareclipse.studio/render/walking/${playerName}/full?bg=transparent" class="rank-4-5-skin" alt="${p.name}" onerror="this.style.display='none'">
            <span class="rank-4-5-badge">${p.tier_rank}</span>
        `;
        return card;
    }

    async function showPlayerDetails(player) {
        const modal = document.getElementById('playerModal');
        const mName = document.getElementById('modalName');
        const mTiers = document.getElementById('modalTiers');
        const mTests = document.getElementById('modalTests');
        const capeSelector = document.getElementById('capeSelector');
        
        mName.innerText = player.name;
        mTiers.innerHTML = '<div style="color:#444">連線中...</div>';
        mTests.innerHTML = '<tr><td colspan="5" style="text-align:center">載入中...</td></tr>';
        capeSelector.innerHTML = '';
        modal.style.display = 'flex';

        if (!skinViewer) {
            skinViewer = new skinview3d.SkinViewer({
                canvas: document.getElementById('skin_container'),
                width: 300, height: 400, alpha: true
            });
            skinViewer.animation = new skinview3d.IdleAnimation();
            skinViewer.zoom = 0.85;
        }

        // 載入 Skin
        try {
            const starlightUrl = `https://starlightskins.lunareclipse.studio/info/user/${player.name}`;
            const data = await smartFetch(starlightUrl);
            skinViewer.loadSkin(data.skinUrl, { model: data.skinType === 'slim' ? 'slim' : 'default' });
            if (data.userCape) {
                skinViewer.loadCape(data.userCape);
                renderCapeToggle(data.userCape);
            } else { skinViewer.loadCape(null); }
        } catch (e) {
            skinViewer.loadSkin(`https://api.mineatar.io/skin/${player.uuid || player.name}`);
        }

        // 載入 Tiers 與 Tests
        try {
            const [tiers, tests] = await Promise.all([
                smartFetch(`${baseApiUrl}/player?name=${player.name}`),
                smartFetch(`${baseApiUrl}/tests/examinee?name=${player.name}`)
            ]);
            
            let finalTiersHtml = '';

            // --- 優先處理水晶 (Vanilla) 資訊卡 ---
            if (currentMode === 'Vanilla') {
                // 如果是水晶分頁，強制在最前方插入一張水晶卡片
                // 資料來自於傳入 player 物件 (此物件已包含從 Sheet 抓到的 rank)
                const tierNum = player.tier_rank.match(/\d/)?.[0] || '5';
                const config = tierConfigs[parseInt(tierNum) - 1] || tierConfigs[4];
                finalTiersHtml += `
                    <div class="info-tier-card vanilla-special" style="border-top: 2px solid var(--vanilla-purple)">
                        <span class="mode-label">💎 Vanilla <span>
                        <div class="rank-container">
                            <span class="rank-value" style="color: var(--vanilla-purple)">${player.tier_rank}</span>
                            <span class="tier-tag" style="background: var(--vanilla-purple)">CORE DATA</span>
                        </div>
                    </div>
                `;
            }

            // --- 渲染其餘資料庫資料 ---
            if (tiers && tiers.length) {
                finalTiersHtml += tiers.map(t => {
                    // 如果這筆資料剛好又是 Vanilla，且我們已經手動插入過了，可選擇跳過或保留（這裡選擇保留以示對比）
                    const tierNum = t.tier_rank.match(/\d/)?.[0] || '5';
                    const config = tierConfigs[parseInt(tierNum) - 1] || tierConfigs[4];
                    const icon = modeIcons[t.mode] || '⚔️';
                    return `
                        <div class="info-tier-card" style="border-top: 2px solid ${config.color}">
                            <span class="mode-label">${icon} ${t.mode}</span>
                            <div class="rank-container">
                                <span class="rank-value" style="color: ${config.color}">${t.tier_rank}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            if (finalTiersHtml === '') {
                mTiers.innerHTML = '<div style="color:var(--text-grey); font-size:0.8rem;">暫無階級紀錄</div>';
            } else {
                mTiers.innerHTML = finalTiersHtml;
            }

            // 測試紀錄渲染
            mTests.innerHTML = (tests && tests.length) ? tests.map(t => `
                <tr>
                    <td style="font-weight:700">${t.mode.toUpperCase()}</td>
                    <td style="color:var(--text-grey)">${t.test_date}</td>
                    <td>${t.examiner}</td>
                    <td><span class="score-box">${t.examinee_grade}:${t.examiner_grade}</span></td>
                    <td><span class="outcome-badge">${t.outcome_tier}</span></td>
                </tr>
            `).join('') : '<tr><td colspan="5" style="text-align:center; color:var(--text-grey);">無紀錄</td></tr>';
        } catch (err) { mTiers.innerHTML = '讀取失敗'; }
    }

    function renderCapeToggle(url) {
        const container = document.getElementById('capeSelector');
        const btn = document.createElement('button');
        btn.className = 'nav-item active'; 
        btn.style.padding = '8px 16px'; btn.style.fontSize = '12px';
        btn.innerText = '切換披風';
        btn.onclick = (e) => {
            const active = e.target.classList.toggle('active');
            skinViewer.loadCape(active ? url : null);
        };
        container.appendChild(btn);
    }

    function handleSearchInput() {
        const val = document.getElementById('searchInput').value.toLowerCase();
        const resultsContainer = document.getElementById('searchResults');
        
        if (!val) {
            resultsContainer.innerHTML = '';
            resultsContainer.classList.remove('show');
            return;
        }

        const filtered = allPlayersFlat.filter(p => p.name.toLowerCase().includes(val)).slice(0, 10);
        
        if (filtered.length > 0) {
            resultsContainer.innerHTML = filtered.map(p => `
                <div class="search-result-item" onclick="selectPlayer('${p.name}')">
                    <img src="https://mc-heads.net/avatar/${p.uuid || p.name}/32" class="search-result-avatar">
                    <div class="search-result-name">${p.name}</div>
                </div>
            `).join('');
            resultsContainer.classList.add('show');
        } else {
            resultsContainer.innerHTML = '<div class="search-result-item">查無此玩家</div>';
            resultsContainer.classList.add('show');
        }
    }

    function selectPlayer(playerName) {
        const player = allPlayersFlat.find(p => p.name === playerName);
        if (player) {
            showPlayerDetails(player);
            document.getElementById('searchResults').classList.remove('show');
            document.getElementById('searchInput').value = '';
        }
    }

    // 點擊外部關閉搜尋結果
    document.addEventListener('click', (e) => {
        const searchContainer = document.querySelector('.top-search-container');
        const resultsContainer = document.getElementById('searchResults');
        if (searchContainer && !searchContainer.contains(e.target)) {
            resultsContainer.classList.remove('show');
        }
    });

    function closeModal() { document.getElementById('playerModal').style.display = 'none'; }

    function toggleNavbar() {
        const navMenu = document.querySelector('.nav-menu');
        const hamburger = document.getElementById('hamburger');
        const overlay = document.getElementById('navOverlay');
        navMenu.classList.toggle('expanded');
        overlay.classList.toggle('active');
        hamburger.textContent = navMenu.classList.contains('expanded') ? '✕' : '☰';
    }

    // 滾動動畫 (Intersection Observer)
    const scrollElements = document.querySelectorAll('.scroll-animate');

    const observer = new IntersectionObserver((entries) => {
        entries.forEach((entry, index) => {
            if (entry.isIntersecting) {
                setTimeout(() => {
                    entry.target.classList.add('visible');
                }, index * 50);
            }
        });
    }, {
        threshold: 0.1,
        rootMargin: '0px 0px -50px 0px'
    });

    scrollElements.forEach(el => observer.observe(el));
</script>
</body>
</html>
