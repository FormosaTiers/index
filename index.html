<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formosa Tiers</title>
    
    <link rel="icon" href="icon.png?v=2" type="image/png">

    <style>
        :root {
            --bg-main: #0f1115;
            --bg-panel: #16181e;
            --bg-card: #20222b;
            --text-white: #eeeeee;
            --text-grey: #8b8e96;
            
            /* Tier Colors */
            --tier1-color: #d4af37;   /* 金色 */
            --tier2-color: #a0a0a0;   /* 銀色 */
            --tier3-color: #cd7f32;   /* 銅色 */
            --tier4-color: #5b7da8;   /* 藍色 */
            --tier5-color: #6e757c;   /* 深灰 */
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            
            display: flex;
            flex-direction: column;
            align-items: center; 
        }

        /* --- 頂部 Header 區域 --- */
        .site-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 10px 0;
            border-bottom: 2px solid #2a2d35;
            
            width: 100%;
            max-width: 1260px; 
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        .site-logo {
            height: 60px;
            width: auto;
            object-fit: contain;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .discord-btn {
            background-color: #5865F2;
            color: white;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s;
            font-size: 0.9rem;
            border: 1px solid transparent;
        }
        
        .discord-btn:hover {
            background-color: #4752C4;
        }

        .discord-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .top-search {
            background-color: #000;
            border: 1px solid #333;
            border-radius: 20px;
            padding: 8px 15px;
            color: #777;
            font-size: 0.9rem;
            width: 250px; 
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .top-search input {
            background: transparent;
            border: none;
            color: #eeeeee;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }
        .top-search input::placeholder {
            color: #555;
        }

        /* --- 導航列 (Navbar) --- */
        .navbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            padding-bottom: 0px;
            overflow-x: auto;
            white-space: nowrap;
            
            width: 100%;
            max-width: 1260px;
            justify-content: center;
        }

        .nav-item {
            padding: 10px 20px;
            color: var(--text-grey);
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
            position: relative;
            transition: color 0.2s;
            user-select: none;
            background-color: #1a1c24;
            border-radius: 8px;
            margin-right: 5px;
        }
        
        .nav-item:hover {
            color: #ccc;
            background-color: #252830;
        }

        .nav-item.active {
            color: white;
            background-color: #3b82f6;
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.4);
        }

        /* --- Tier 佈局 --- */
        .tier-board {
            display: flex;
            flex-direction: row;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 20px;
            align-items: flex-start;
            
            width: 100%;
            max-width: 1260px;
            justify-content: center;
            min-height: 400px; /* 防止加載時塌陷 */
        }

        .tier-column {
            flex: 0 0 240px;
            width: 240px;
            display: flex;
            flex-direction: column;
        }

        .tier-header {
            padding: 12px;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            border-top-left-radius: 6px;
            border-top-right-radius: 6px;
            background-color: #1e2028;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        /* 顏色定義 */
        .t1-header { color: var(--tier1-color); border-top: 3px solid var(--tier1-color); background: linear-gradient(to bottom, #2d2a1e, #1e2028); }
        .t2-header { color: var(--tier2-color); border-top: 3px solid var(--tier2-color); }
        .t3-header { color: var(--tier3-color); border-top: 3px solid var(--tier3-color); }
        .t4-header { color: var(--tier4-color); border-top: 3px solid var(--tier4-color); }
        .t5-header { color: var(--tier5-color); border-top: 3px solid var(--tier5-color); }

        .player-list {
            background-color: var(--bg-panel);
            border-bottom-left-radius: 6px;
            border-bottom-right-radius: 6px;
            padding: 5px;
            min-height: 200px;
        }

        .player-card {
            background-color: var(--bg-card);
            margin-bottom: 4px;
            padding: 6px 10px;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 3px;
            cursor: pointer;
            transition: background 0.2s;
            position: relative;
            overflow: hidden;
        }

        .player-card:hover { background-color: #2a2d38; }

        .player-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
        }
        
        .t1-card::before { background-color: var(--tier1-color); }
        .t2-card::before { background-color: var(--tier2-color); }
        .t3-card::before { background-color: var(--tier3-color); }
        .t4-card::before { background-color: var(--tier4-color); }
        .t5-card::before { background-color: var(--tier5-color); }

        .arrow-icon { color: #444; font-size: 12px; }
        
        .no-data, .loading-data {
            width: 100%;
            text-align: center;
            color: #555;
            margin-top: 50px;
            font-size: 1.5rem;
        }
        
        /* 簡單的加載動畫 */
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #555;
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <header class="site-header">
        <div class="logo-container">
            <img src="logo.png" class="site-logo" alt="Formosa Tiers Logo">
        </div>
        
        <div class="header-controls">
            <a href="https://discord.gg/yctefdXTvy" target="_blank" class="discord-btn" title="Join our Discord">
                <svg viewBox="0 0 24 24">
                    <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037 13.924 13.924 0 0 0-.623 1.282 18.445 18.445 0 0 0-5.46 0 14.155 14.155 0 0 0-.623-1.282.072.072 0 0 0-.078-.037 19.742 19.742 0 0 0-4.886 1.515.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-2.313-9.117-6.046-13.687a.066.066 0 0 0-.03-.027ZM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.419 0 1.334-.956 2.419-2.157 2.419Zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.419 0 1.334-.946 2.419-2.157 2.419Z"/>
                </svg>
                <span>Discord</span>
            </a>

            <div class="top-search">
                <input type="text" id="searchInput" placeholder="Search player..." onkeyup="filterPlayers()">
                <span>🔍</span>
            </div>
        </div>
    </header>

    <div class="navbar">
        <div class="nav-item active" onclick="switchTab(this, 'Sword')">🗡️ 鑽石王牌</div>
        <div class="nav-item" onclick="switchTab(this, 'UHC')">❤️ UHC(封存)</div>
        <div class="nav-item" onclick="switchTab(this, 'Pot')">🧪 鑽石POT</div>
        <div class="nav-item" onclick="switchTab(this, 'NethOP')">👾 獄髓POT</div>
        <div class="nav-item" onclick="switchTab(this, 'SMP')">🌍 SMP</div>
        <div class="nav-item" onclick="switchTab(this, 'Mace')">🔨 重捶</div>
        <div class="nav-item" onclick="switchTab(this, 'Axe')">🪓 盾斧</div>
        <div class="nav-item" onclick="switchTab(this, 'Vanilla')">💎 水晶(華人榜)</div>
    </div>

    <div class="tier-board" id="tierBoard">
        </div>

<script>
    // --- 設定區 ---
    const apiEndpoint = 'https://corsproxy.io/?' + encodeURIComponent('https://formosa-tier-list-database-api.vercel.app/api/tiers/overall');
    const googleSheetId = '1pRSRy8WOP5EJ7dng58QWZhuH90l4B0nFWqWI6rGoAyo';
    // --------------
    
    let database = {}; // 格式: { "sword": { "Tier 1": [], ... }, "uhc": ... }
    let currentMode = '';
    let usingGoogleSheets = false; // 標記當前是否使用 Google Sheets
    let apiFailed = false; // 記錄 API 是否失敗

    // 將按鈕的中文/顯示名稱 對應到 API 回傳的 mode 欄位值
    const modeMapping = {
        'Sword': 'sword',
        'UHC': 'uhc',
        'Pot': 'DPot',
        'NethOP': 'nethop',
        'SMP': 'SMP',
        'Mace': 'Mace',
        'Axe': 'axe',
        'Vanilla': 'Vanilla' // 特殊：只使用 Google Sheets
    };

    // Tier 樣式設定
    const tierConfigs = [
        { name: "Tier 1", headerClass: "t1-header", cardClass: "t1-card", icon: "🥇" },
        { name: "Tier 2", headerClass: "t2-header", cardClass: "t2-card", icon: "🥈" },
        { name: "Tier 3", headerClass: "t3-header", cardClass: "t3-card", icon: "🥉" },
        { name: "Tier 4", headerClass: "t4-header", cardClass: "t4-card", icon: "" },
        { name: "Tier 5", headerClass: "t5-header", cardClass: "t5-card", icon: "" }
    ];

    const levelMap = {
        'H': { score: 3, label: 'H', color: '#ff4d4d' },
        'M': { score: 2, label: 'M', color: '#ffd700' },
        'L': { score: 1, label: 'L', color: '#4caf50' }
    };

    window.onload = function() {
        // 第一步：嘗試從 API 抓取所有資料 (Vanilla 除外)
        fetchAllData();
    };

    async function fetchAllData() {
        const board = document.getElementById('tierBoard');
        board.innerHTML = `<div class="loading-data"><span class="loading-spinner"></span>初始化數據中...</div>`;

        try {
            const response = await fetch(apiEndpoint, {
                method: 'GET',
                mode: 'cors' 
            });

            if (!response.ok) {
                throw new Error(`伺服器回應錯誤: ${response.status}`);
            }

            const rawData = await response.json();
            console.log("成功獲取API數據:", rawData);
            
            processAllData(rawData);
            apiFailed = false;
            
            const defaultBtn = document.querySelector(`.nav-item[onclick*="'Sword'"]`);
            switchTab(defaultBtn, 'Sword');

        } catch (err) {
            console.error("API獲取失敗，嘗試使用Google Sheets:", err);
            apiFailed = true;
            
            // API 失敗，嘗試加載所有模式的 Google Sheets 數據
            loadAllFromGoogleSheets();
        }
    }

    function processAllData(data) {
        database = {}; // 清空資料庫
        
        data.forEach(item => {
            const mode = item.mode; // 如 'sword'
            const tierName = `Tier ${item.tier}`;
            
            if (!database[mode]) database[mode] = {};
            if (!database[mode][tierName]) database[mode][tierName] = [];

            database[mode][tierName].push({
                name: item.player,
                level: item.subtier ? item.subtier.toUpperCase() : 'M',
                uuid: item.uuid
            });
        });

        // 對每個 Tier 進行 H/M/L 排序
        for (const m in database) {
            for (const t in database[m]) {
                database[m][t].sort((a, b) => {
                    const scoreA = levelMap[a.level]?.score || 0;
                    const scoreB = levelMap[b.level]?.score || 0;
                    return scoreB - scoreA;
                });
            }
        }
    }

    async function loadAllFromGoogleSheets() {
        const board = document.getElementById('tierBoard');
        board.innerHTML = `<div class="loading-data"><span class="loading-spinner"></span>正在從 Google Sheets 載入數據...</div>`;
        
        database = {}; // 清空資料庫
        usingGoogleSheets = true;
        
        try {
            // 為每個模式（Vanilla 除外）加載數據
            const modes = ['Sword', 'UHC', 'Pot', 'NethOP', 'SMP', 'Mace', 'Axe'];
            
            // 並行加載所有模式
            const promises = modes.map(mode => fetchGoogleSheetData(mode));
            const results = await Promise.allSettled(promises);
            
            console.log("Google Sheets 加載結果:", results);
            
            const defaultBtn = document.querySelector(`.nav-item[onclick*="'Sword'"]`);
            switchTab(defaultBtn, 'Sword');
            
        } catch (err) {
            console.error("Google Sheets 加載失敗:", err);
            board.innerHTML = `
                <div class="no-data">
                    數據載入失敗<br>
                    <small style="color: #666;">API 和 Google Sheets 都無法存取</small><br>
                    <button onclick="retryLoading()" style="margin-top:10px; padding:5px 15px; cursor:pointer;">重新嘗試</button>
                </div>`;
        }
    }

    async function fetchGoogleSheetData(sheetName) {
        try {
            const response = await fetch(`https://opensheet.elk.sh/${googleSheetId}/${sheetName}`);
            
            if (!response.ok) {
                throw new Error(`Google Sheets 回應錯誤: ${response.status}`);
            }
            
            const rows = await response.json();
            
            if (!Array.isArray(rows) || rows.length === 0) {
                console.warn(`Google Sheets 分頁 "${sheetName}" 沒有數據或格式錯誤`);
                return;
            }
            
            // 處理 Google Sheets 數據
            processGoogleSheetData(rows, sheetName);
            
        } catch (err) {
            console.error(`加載 Google Sheets 分頁 "${sheetName}" 失敗:`, err);
        }
    }

    function processGoogleSheetData(rows, sheetName) {
        const apiModeName = modeMapping[sheetName] || sheetName.toLowerCase();
        
        if (!database[apiModeName]) database[apiModeName] = {};

        rows.forEach(row => {
            if (!row.tier || !row.player) return;

            const tierName = `Tier ${row.tier}`;
            const playerObj = {
                name: row.player,
                level: row.level ? row.level.toUpperCase() : 'M',
                uuid: row.uuid || '' // Google Sheets 可能沒有 UUID
            };

            if (!database[apiModeName][tierName]) {
                database[apiModeName][tierName] = [];
            }

            database[apiModeName][tierName].push(playerObj);
        });

        // 排序 (根據 H/M/L)
        if (database[apiModeName]) {
            for (const tier in database[apiModeName]) {
                database[apiModeName][tier].sort((a, b) => {
                    const scoreA = levelMap[a.level]?.score || 0;
                    const scoreB = levelMap[b.level]?.score || 0;
                    return scoreB - scoreA;
                });
            }
        }
    }

    function switchTab(element, displayName) {
        // UI 更新
        if(element) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            element.classList.add('active');
        }
        
        const searchInput = document.getElementById('searchInput');
        if(searchInput) searchInput.value = '';

        // 對應 API 的模式名稱
        const apiMode = modeMapping[displayName] || displayName.toLowerCase();
        currentMode = apiMode;

        // 檢查是否已經有資料
        if (database[apiMode] && Object.keys(database[apiMode]).length > 0) {
            renderBoard(apiMode, displayName);
        } else {
            // 沒有資料則去抓取
            loadTabData(displayName, apiMode);
        }
    }

    function loadTabData(displayName, apiMode) {
        const board = document.getElementById('tierBoard');
        board.innerHTML = `<div class="loading-data"><span class="loading-spinner"></span>正在載入 ${displayName} 數據...</div>`;

        // Vanilla 模式始終使用 Google Sheets
        if (displayName === 'Vanilla') {
            fetchGoogleSheetData(displayName)
                .then(() => {
                    renderBoard(apiMode, displayName);
                })
                .catch(err => {
                    console.error("加載 Vanilla 失敗:", err);
                    board.innerHTML = `<div class="no-data">無法載入 ${displayName} 數據</div>`;
                });
        } 
        // API 已失敗，使用 Google Sheets
        else if (apiFailed) {
            fetchGoogleSheetData(displayName)
                .then(() => {
                    renderBoard(apiMode, displayName);
                })
                .catch(err => {
                    console.error("加載失敗:", err);
                    board.innerHTML = `<div class="no-data">無法載入 ${displayName} 數據</div>`;
                });
        }
        // 嘗試使用 API (但可能之前整體 API 失敗)
        else {
            // 如果已經知道 API 失敗，就使用 Google Sheets
            if (apiFailed) {
                fetchGoogleSheetData(displayName)
                    .then(() => {
                        renderBoard(apiMode, displayName);
                    });
            } else {
                renderBoard(apiMode, displayName);
            }
        }
    }

    function renderBoard(mode, displayName) {
        const board = document.getElementById('tierBoard');
        board.innerHTML = ''; 

        const currentData = database[mode];

        if (!currentData || Object.keys(currentData).length === 0) {
            board.innerHTML = `<div class="no-data">${displayName} 暫無數據 / No Data</div>`;
            return;
        }

        tierConfigs.forEach(config => {
            const players = currentData[config.name] || [];
            const col = document.createElement('div');
            col.className = 'tier-column';

            const header = document.createElement('div');
            header.className = `tier-header ${config.headerClass}`;
            header.textContent = (config.icon ? `${config.icon} ` : '') + config.name;

            const list = document.createElement('div');
            list.className = 'player-list';

            players.forEach(p => {
                const lvlInfo = levelMap[p.level] || levelMap['M'];
                const card = document.createElement('div');
                card.className = `player-card ${config.cardClass}`;
                
                // 如果有 UUID 就顯示頭像
                const avatarHtml = p.uuid ? 
                    `<img src="https://mc-heads.net/avatar/${p.uuid}/16" alt="" style="width:16px; height:16px; border-radius:2px;">` : '';
                
                card.innerHTML = `
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="background:${lvlInfo.color}; color:#000; font-size:0.75rem; font-weight:bold; padding:1px 5px; border-radius:4px; min-width:18px; text-align:center;">
                            ${lvlInfo.label}
                        </span>
                        ${avatarHtml}
                        <span class="player-name-text"></span>
                    </div>
                    <span class="arrow-icon">»</span>
                `;
                
                // 安全地插入玩家名稱
                card.querySelector('.player-name-text').textContent = p.name;
                list.appendChild(card);
            });

            col.appendChild(header);
            col.appendChild(list);
            board.appendChild(col);
        });
        
        // 顯示當前數據來源
        if (apiFailed || displayName === 'Vanilla') {
            const sourceInfo = document.createElement('div');
            sourceInfo.style.cssText = 'width:100%; text-align:center; color:#666; font-size:0.8rem; margin-top:10px;';
            sourceInfo.textContent = '數據來源: Google Sheets';
            board.appendChild(sourceInfo);
        }
        
        filterPlayers();
    }

    function filterPlayers() {
        const input = document.getElementById('searchInput').value.toLowerCase();
        const cards = document.querySelectorAll('.player-card');

        cards.forEach(card => {
            const text = card.textContent.toLowerCase();
            card.style.display = text.includes(input) ? "flex" : "none";
        });
    }

    function retryLoading() {
        // 重新嘗試載入數據
        fetchAllData();
    }
</script>
</body>
</html>
